name: CI

# 平时提交的构建检查。发布走 release.yml（推 tag 触发）。
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # 模组独有的一步，从贴图生成方块列表
      - name: Generate Block List
        run: ./gradlew :genBlockList:generateDefaultBlockIds

      # datagen的内容不会被提交
      - name: Run datagen
        run: ./gradlew runData --no-daemon --stacktrace

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: brfurniture-jar
          path: build/libs/*.jar
          if-no-files-found: error
