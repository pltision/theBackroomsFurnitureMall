name: Release

# 推 tag 时发布：tag 名就是模组版本号，不带 "v" 前缀。
# 例如 `git tag 0.1 && git push origin 0.1` 会发布版本 0.1。
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          echo "tag = $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        id: version

        # 模组独有的一步，从贴图生成方块列表
      - name: Generate Block List
        run: .\gradlew :genBlockList:generateDefaultBlockIds

      # datagen的内容不会被提交
      - name: Run datagen
        run: ./gradlew runData --no-daemon --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
