// genBlockList：不依赖 Minecraft / NeoForge 的独立代码生成模块。
//
// 它只做一件事：读取贴图目录与人工维护的展示名表，写出 codegen 源集里的
// DefaultBlockIds.java。之所以放在这里而不是 datagen，是因为 generated 模块
// 在每次 runData 时都会被清空，而 DefaultBlockIds 是"默认配置"级别的输入。
plugins {
    id 'java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 生成物落在根项目的 codegen 源集里（该目录被 src/codegen/.gitignore 忽略）。
def generatedIdsDir = rootProject.layout.projectDirectory.dir('src/codegen/java')
// 递归扫描 textures/block/block/ 这棵子树，相对路径（去掉 .png）就是方块 id。
// 放在 textures/block/ 下是为了按内容分组，而 textures/block/ 里还有
// exhibition_wall/、normal/、level0/、pipes/、can/ 这些手写贴图，所以只扫 block/ 这一棵。
def textureDir = rootProject.layout.projectDirectory.dir('src/main/resources/assets/brfurniture/textures/block/block')

// 展示名表（<方块id>=<中文>|<English>）分两层，和 config/brfurniture/blocks.txt 覆盖方块列表同一个思路：
//   1. 内置默认表：src/main/resources/.../block_names.properties —— 它是资源文件，会打进 jar；
//   2. 覆盖表：config/brfurniture/block_names.properties —— 存在时优先用它。
// 两个文件都是**可选**的：都没有时生成器会按 id 自动推导名字（level0_bricks -> "Level0 Bricks"）。
def displayNameFile = rootProject.layout.projectDirectory.file('src/main/resources/assets/brfurniture/block_names.properties')
def displayNameOverrideFile = rootProject.layout.projectDirectory.file('config/brfurniture/block_names.properties')
def hasDisplayNameFile = displayNameFile.asFile.isFile()
def hasDisplayNameOverride = displayNameOverrideFile.asFile.isFile()

tasks.register('generateDefaultBlockIds', JavaExec) {
    group = 'brfurniture'
    description = '扫描方块贴图，生成 src/codegen/java/.../codegen/DefaultBlockIds.java'

    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'yee.pltision.brfurniture.genblocklist.GenerateDefaultBlockIds'

    // 贴图目录是必需输入：没有它什么都生成不出来，让 Gradle 在配置阶段直接报出来。
    inputs.dir(textureDir).withPropertyName('blockTextures')
    outputs.dir(generatedIdsDir).withPropertyName('generatedIds')

    // 展示名表是可选输入，所以只在文件真的存在时才登记。
    // 不能无条件 inputs.file(...)：Gradle 在**配置阶段**就会校验，文件不在时直接抛
    // "input file does not exist" 把整个构建挂掉（onlyIf 拦不住，它求值更晚）。
    if (hasDisplayNameFile) {
        inputs.file(displayNameFile).withPropertyName('displayNames')
    }
    if (hasDisplayNameOverride) {
        inputs.file(displayNameOverrideFile).withPropertyName('displayNamesOverride')
    }

    args = [
            '--textures', textureDir.asFile.absolutePath,
            '--output', generatedIdsDir.asFile.absolutePath,
            '--package', 'yee.pltision.brfurniture.codegen',
    ]
    if (hasDisplayNameFile) {
        args += ['--display-names', displayNameFile.asFile.absolutePath]
    }
    // 覆盖表总是传过去：生成器自己判断"存在才用"，不存在就退回内置表。
    // 路径要相对工程根目录，因为 JavaExec 的工作目录是 genBlockList/。
    args += ['--display-names-override', displayNameOverrideFile.asFile.absolutePath]

    doFirst {
        logger.lifecycle("[genBlockList] 扫描贴图目录: ${textureDir.asFile}")
        if (hasDisplayNameOverride) {
            logger.lifecycle("[genBlockList] 展示名表: ${displayNameOverrideFile.asFile}（覆盖内置表）")
        } else if (hasDisplayNameFile) {
            logger.lifecycle("[genBlockList] 展示名表: ${displayNameFile.asFile}")
        }
        // 两个都没有时不在这里重复打印：生成器自己会说明"全部按 id 推导"。
        // 这是合法状态，所以也不该 warn。
    }
}
