pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// genBlockList 是独立的、不依赖 Minecraft / NeoForge 的方块列表生成模块。
// 它扫描 src/main/resources/assets/brfurniture/textures/block/*.png 并写出
// src/codegen/java/.../codegen/DefaultBlockIds.java。
include 'genBlockList'
