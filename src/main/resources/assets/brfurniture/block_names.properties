# 后室家具店 —— 方块展示名表
#
# 格式：<方块id>=<中文>|<English>
#   - 方块 id 就是贴图的相对路径去掉 .png，例如 block/level0/wall.png -> level0/wall
#   - 填的是“基础名”，展墙 / 展墙墙根的名字由代码在基础名后面拼后缀得到
#   - 没写在这里的 id 会按 id 自动推导（moss_concrete_rubble -> "Mossy Concrete Rubble"）
#   - 必须用 UTF-8 保存，不要用 GBK
#
# 这个文件是**构建期**读的：genBlockList 用它生成 DefaultBlockIds，
# datagen 再据此产出 assets/brfurniture/lang/{zh_cn,en_us}.json。
# 所以改完名字要重新构建，改的是生成结果而不是运行时行为。
#
# 覆盖方式：把同名文件放到 config/brfurniture/block_names.properties，
# 构建时会优先读那个（和 config/brfurniture/blocks.txt 覆盖方块列表是同一个思路）。

level0_wall=Level0墙壁|Level0 Wall
level0_bricks=Level0砖墙|Level0 Bricks
level0_carpet=Level0地毯|Level0 Carpet
level0_ceiling=Level0天花板|Level0 Ceiling
level0_light=Level0灯|Level0 Light
concrete=混凝土|Concrete
concrete_rubble=混凝土碎块|Concrete Rubble
cracking_concrete_1=开裂混凝土|Cracking Concrete 1
cracking_concrete_2=开裂混凝土|Cracking Concrete 2
moss_concrete_rubble=苔藓混凝土碎块|Mossy Concrete Rubble
moss_cracking_concrete_1=苔藓开裂混凝土|Mossy Cracking Concrete 1
moss_cracking_concrete_2=苔藓开裂混凝土|Mossy Cracking Concrete 2
white_concrete=白色混凝土|White Concrete
# 这两个其实是家具阶段的方块（现在只是普通实心方块），名字先按贴图大意填，做家具时再改。
wooden_chara=木质椅子|Wooden Chair
wooden_table=木质桌子|Wooden Table
